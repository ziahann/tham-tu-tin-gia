<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Truy tìm dấu vết</title>
  <meta name="description" content="Game pixel nhập vai về thẩm định ảnh AI giả quanh vụ lật tàu Vịnh Xanh 58. Tình huống, nhân vật là GIẢ LẬP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="hide-sensitive">
  <!-- Bản đồ Phaser tràn toàn khung -->
  <div id="game" aria-label="Bản đồ trò chơi" role="application"></div>

  <!-- Thanh trên -->
  <header id="hud" class="hud" hidden>
    <div class="hud-left">
      <span class="hud-title" data-ui="gameTitle"></span>
      <span id="hud-place" class="hud-place" aria-live="polite"></span>
      <button type="button" id="hud-track" class="hud-track"></button>
      <span id="hud-meters" class="hud-meters" hidden>
        <span class="meter meter-cred"><b data-ui="obstacles.cred"></b><span class="bar"><i></i></span></span>
        <span class="meter meter-press" data-ui-label="obstacles.pressureTitle"><b data-ui="obstacles.pressure"></b><span class="bar"><i></i></span></span>
      </span>
    </div>
    <div class="hud-right">
      <span id="hud-clock" class="hud-score hud-clock"></span>
      <span id="hud-score" class="hud-score"></span>
      <button type="button" id="btn-cases" class="icon-btn" data-ui-label="icons.cases">
        <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M1 3h5l1 1h8v10H1zm1 2v8h12V5zm2 2h5v1H4zm0 2h7v1H4z"/></svg>
      </button>
      <button type="button" id="btn-backpack" class="icon-btn" data-ui-label="icons.backpack">
        <svg viewBox="0 0 16 17" aria-hidden="true" shape-rendering="crispEdges"><rect x="5" y="0" width="6" height="1" fill="#0b0f18"/><rect x="4" y="1" width="1" height="1" fill="#0b0f18"/><rect x="5" y="1" width="6" height="1" fill="#2c3a5c"/><rect x="11" y="1" width="1" height="1" fill="#0b0f18"/><rect x="4" y="2" width="1" height="1" fill="#0b0f18"/><rect x="5" y="2" width="1" height="1" fill="#2c3a5c"/><rect x="10" y="2" width="1" height="1" fill="#2c3a5c"/><rect x="11" y="2" width="1" height="1" fill="#0b0f18"/><rect x="2" y="3" width="12" height="1" fill="#0b0f18"/><rect x="1" y="4" width="1" height="1" fill="#0b0f18"/><rect x="2" y="4" width="2" height="1" fill="#f27a86"/><rect x="4" y="4" width="10" height="1" fill="#d8283f"/><rect x="14" y="4" width="1" height="1" fill="#0b0f18"/><rect x="1" y="5" width="1" height="1" fill="#0b0f18"/><rect x="2" y="5" width="1" height="1" fill="#f27a86"/><rect x="3" y="5" width="11" height="1" fill="#d8283f"/><rect x="14" y="5" width="1" height="1" fill="#0b0f18"/><rect x="1" y="6" width="1" height="1" fill="#0b0f18"/><rect x="2" y="6" width="12" height="1" fill="#a81d33"/><rect x="14" y="6" width="1" height="1" fill="#0b0f18"/><rect x="1" y="7" width="1" height="1" fill="#0b0f18"/><rect x="2" y="7" width="12" height="1" fill="#a81d33"/><rect x="14" y="7" width="1" height="1" fill="#0b0f18"/><rect x="1" y="8" width="1" height="1" fill="#0b0f18"/><rect x="2" y="8" width="5" height="1" fill="#a81d33"/><rect x="7" y="8" width="2" height="1" fill="#ffd54a"/><rect x="9" y="8" width="5" height="1" fill="#a81d33"/><rect x="14" y="8" width="1" height="1" fill="#0b0f18"/><rect x="1" y="9" width="1" height="1" fill="#0b0f18"/><rect x="2" y="9" width="5" height="1" fill="#a81d33"/><rect x="7" y="9" width="2" height="1" fill="#c9942a"/><rect x="9" y="9" width="5" height="1" fill="#a81d33"/><rect x="14" y="9" width="1" height="1" fill="#0b0f18"/><rect x="0" y="10" width="1" height="1" fill="#0b0f18"/><rect x="1" y="10" width="1" height="1" fill="#2c3a5c"/><rect x="2" y="10" width="1" height="1" fill="#d8283f"/><rect x="3" y="10" width="10" height="1" fill="#2c3a5c"/><rect x="13" y="10" width="1" height="1" fill="#d8283f"/><rect x="14" y="10" width="1" height="1" fill="#2c3a5c"/><rect x="15" y="10" width="1" height="1" fill="#0b0f18"/><rect x="0" y="11" width="1" height="1" fill="#0b0f18"/><rect x="1" y="11" width="1" height="1" fill="#2c3a5c"/><rect x="2" y="11" width="1" height="1" fill="#d8283f"/><rect x="3" y="11" width="2" height="1" fill="#2c3a5c"/><rect x="5" y="11" width="4" height="1" fill="#f4f6fa"/><rect x="9" y="11" width="4" height="1" fill="#2c3a5c"/><rect x="13" y="11" width="1" height="1" fill="#d8283f"/><rect x="14" y="11" width="1" height="1" fill="#2c3a5c"/><rect x="15" y="11" width="1" height="1" fill="#0b0f18"/><rect x="0" y="12" width="1" height="1" fill="#0b0f18"/><rect x="1" y="12" width="1" height="1" fill="#2c3a5c"/><rect x="2" y="12" width="1" height="1" fill="#d8283f"/><rect x="3" y="12" width="2" height="1" fill="#2c3a5c"/><rect x="5" y="12" width="4" height="1" fill="#f4f6fa"/><rect x="9" y="12" width="4" height="1" fill="#2c3a5c"/><rect x="13" y="12" width="1" height="1" fill="#d8283f"/><rect x="14" y="12" width="1" height="1" fill="#2c3a5c"/><rect x="15" y="12" width="1" height="1" fill="#0b0f18"/><rect x="0" y="13" width="1" height="1" fill="#0b0f18"/><rect x="1" y="13" width="1" height="1" fill="#2c3a5c"/><rect x="2" y="13" width="1" height="1" fill="#d8283f"/><rect x="3" y="13" width="3" height="1" fill="#2c3a5c"/><rect x="6" y="13" width="2" height="1" fill="#f4f6fa"/><rect x="8" y="13" width="5" height="1" fill="#2c3a5c"/><rect x="13" y="13" width="1" height="1" fill="#d8283f"/><rect x="14" y="13" width="1" height="1" fill="#2c3a5c"/><rect x="15" y="13" width="1" height="1" fill="#0b0f18"/><rect x="0" y="14" width="1" height="1" fill="#0b0f18"/><rect x="1" y="14" width="1" height="1" fill="#2c3a5c"/><rect x="2" y="14" width="1" height="1" fill="#d8283f"/><rect x="3" y="14" width="10" height="1" fill="#2c3a5c"/><rect x="13" y="14" width="1" height="1" fill="#d8283f"/><rect x="14" y="14" width="1" height="1" fill="#2c3a5c"/><rect x="15" y="14" width="1" height="1" fill="#0b0f18"/><rect x="0" y="15" width="1" height="1" fill="#0b0f18"/><rect x="1" y="15" width="1" height="1" fill="#2c3a5c"/><rect x="2" y="15" width="1" height="1" fill="#d8283f"/><rect x="3" y="15" width="10" height="1" fill="#2c3a5c"/><rect x="13" y="15" width="1" height="1" fill="#d8283f"/><rect x="14" y="15" width="1" height="1" fill="#2c3a5c"/><rect x="15" y="15" width="1" height="1" fill="#0b0f18"/><rect x="0" y="16" width="16" height="1" fill="#0b0f18"/></svg>
      </button>
      <button type="button" id="btn-sources" class="icon-btn" data-ui-label="icons.sources">
        <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M2 2h5v1h2V2h5v11H9v1H7v-1H2zm1 1v9h4V4H6V3zm6 0v1H9v8h4V3zM4 5h2v1H4zm6 0h2v1h-2zM4 7h2v1H4zm6 0h2v1h-2z"/></svg>
      </button>
      <button type="button" id="btn-settings" class="icon-btn" data-ui-label="icons.settings">
        <svg viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M7 1h2v2h1v1h1V3h2v2h-1v1h1v1h2v2h-2v1h-1v1h1v2h-2v-1h-1v1H9v2H7v-2H6v-1H5v1H3v-2h1v-1H3V9H1V7h2V6h1V5H3V3h2v1h1V3h1zm0 4v1H6v4h1v1h2v-1h1V6H9V5z"/></svg>
      </button>
    </div>
  </header>

  <!-- Thanh "uy tín lập luận" của boss -->
  <div id="boss-bar" class="boss-bar" hidden role="status">
    <span class="boss-name"></span>
    <span class="boss-meter"></span>
  </div>

  <!-- Khung thoại kiểu game cốt truyện -->
  <section id="dialog" class="dialog" hidden aria-label="Hội thoại">
    <!-- Chân dung lớn: nhân vật chính bên trái, người / vật đang tương tác bên phải; ai đang nói thì sáng lên -->
    <div id="dialog-stage" class="dialog-stage" aria-hidden="true">
      <div id="portrait-left" class="portrait portrait-left"></div>
      <div id="portrait-right" class="portrait portrait-right"></div>
    </div>
    <div class="dialog-box">
      <div class="dialog-main">
        <div class="dialog-name"><span id="dialog-name"></span> <span id="dialog-tag" class="tag tag-sim"></span></div>
        <p id="dialog-text" class="dialog-text"></p>
        <div id="dialog-extra" class="dialog-extra"></div>
        <div id="dialog-next" class="dialog-next" aria-hidden="true"></div>
      </div>
    </div>
    <div id="dialog-live" class="sr-only" aria-live="polite"></div>
  </section>

  <!-- Balo: khung dọc bên phải -->
  <aside id="backpack" class="backpack" hidden aria-labelledby="backpack-title">
    <div class="backpack-head">
      <h2 id="backpack-title" data-ui="backpack.title"></h2>
      <button type="button" id="backpack-close" class="btn-small" data-ui="close"></button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="notebook" data-ui="backpack.tabNotebook"></button>
      <button type="button" role="tab" data-tab="quests" data-ui="backpack.tabQuests"></button>
      <button type="button" role="tab" data-tab="feed" data-ui="backpack.tabFeed"></button>
      <button type="button" role="tab" data-tab="pinboard" data-ui="backpack.tabPinboard"></button>
      <button type="button" role="tab" data-tab="history" data-ui="backpack.tabHistory"></button>
      <button type="button" role="tab" data-tab="guide" data-ui="tipsUi.tab"></button>
    </div>
    <div id="backpack-body" class="backpack-body" role="tabpanel"></div>
  </aside>

  <div id="tip" class="tip" role="status" aria-live="polite" hidden></div>

  <!-- Phím ảo cho điện thoại -->
  <div id="touch" class="touch" hidden>
    <div id="stick" class="stick" role="application" aria-label="Cần điều khiển 8 hướng"><i class="stick-knob"></i></div>
    <button type="button" id="touch-a" class="touch-a" aria-label="Hành động">A</button>
  </div>

  <!-- Điện thoại cầm dọc: nhắc xoay ngang -->
  <div id="rotate" class="rotate" aria-live="polite"><div class="rotate-phone"></div><p data-ui="rotate.text"></p></div>

  <!-- Nền chuyển động vịnh Hạ Long (màn hình chính + intro) -->
  <canvas id="bay" class="bay" hidden role="img"></canvas>

  <!-- Màn hình chính + cảnh báo nội dung -->
  <section id="title" class="title-screen" hidden>
    <div class="title-card">
      <p class="title-course" data-ui="title.course"></p>
      <h1 class="logo">
        <svg class="logo-icon" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges"><path fill="currentColor" d="M5 1h4v1h1v1h1v1h1v4h-1v1h-1v1h1v1h1v1h1v1h1v2h-2v-1h-1v-1h-1v-1h-1v-1H9v1H5v-1H4v-1H3V9H2V4h1V3h1V2h1zm0 2v1H4v4h1v1h4V8h1V4H9V3z"/><path fill="#fff" d="M5 4h1v1H5z"/></svg>
        <span data-ui="gameTitle"></span>
      </h1>
      <p id="title-record" class="title-record" hidden></p>
      <div id="title-actions" class="actions title-actions">
        <button type="button" id="title-start" class="btn-primary" data-ui="title.start"></button>
        <button type="button" id="title-continue" class="btn-primary" data-ui="title.continue"></button>
        <button type="button" id="title-restart" class="btn" data-ui="title.restart"></button>
      </div>
      <div class="fine-print" role="note">
        <p><span aria-hidden="true">⚠ </span><span data-ui="title.warningShort"></span></p>
        <details>
          <summary data-ui="title.warningMore"></summary>
          <h2 data-ui="title.warningTitle"></h2>
          <p data-ui="title.warning"></p>
          <p data-ui="title.simulatedNote"></p>
          <h2 data-ui="title.controlsTitle"></h2>
          <p data-ui="title.controls"></p>
        </details>
        <p data-ui="scoreDisclaimer"></p>
        <p class="title-authors" data-ui="title.authors"></p>
      </div>
    </div>
  </section>

  <!-- Intro: bối cảnh vụ án trên nền vịnh chuyển động -->
  <section id="intro" class="intro" hidden aria-label="Chọn nhân vật">
    <div class="intro-box">
      <h2 id="intro-title" data-ui="title.pickTitle"></h2>
      <form id="intro-name">
        <p data-ui="title.lookLabel"></p>
        <div class="look-pick" role="radiogroup">
          <button type="button" class="look" data-look="m" aria-pressed="true"><span class="look-img"></span><span data-ui="title.lookM"></span></button>
          <button type="button" class="look" data-look="f" aria-pressed="false"><span class="look-img"></span><span data-ui="title.lookF"></span></button>
        </div>
        <label for="intro-name-input" data-ui="title.nameLabel"></label>
        <div class="answer-row">
          <input id="intro-name-input" maxlength="20" autocomplete="off" required>
          <button type="submit" class="btn-primary" id="intro-start" data-ui="title.nameConfirm"></button>
        </div>
        <p class="muted small" data-ui="title.nameHint"></p>
        <button type="button" id="intro-back" class="btn" data-ui="title.back"></button>
      </form>
    </div>
  </section>

  <!-- S10: Kết quả -->
  <section id="results" class="title-screen results" hidden aria-labelledby="results-title">
    <div class="title-card">
      <p class="title-game" data-ui="gameTitle"></p>
      <h1 id="results-title"></h1>
      <div class="panel results-stats" id="results-stats"></div>
      <div class="results-cols">
        <div class="panel"><h2 id="results-verified-title"></h2><ul id="results-verified"></ul></div>
        <div class="panel"><h2 id="results-unsure-title"></h2><ul id="results-unsure"></ul></div>
      </div>
      <div class="panel"><p id="results-takeaway"></p></div>
      <p class="muted" data-ui="results.disclaimer"></p>
      <div class="actions">
        <button type="button" id="results-continue" class="btn-primary"></button>
        <button type="button" id="results-sources" class="btn"></button>
        <button type="button" id="results-replay" class="btn"></button>
        <button type="button" id="results-home" class="btn"></button>
      </div>
    </div>
  </section>

  <p id="loading" class="loading" data-ui="loading">Đang tải hồ sơ…</p>

  <dialog id="modal" class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button type="button" id="modal-close" class="btn-small" data-ui="close"></button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
