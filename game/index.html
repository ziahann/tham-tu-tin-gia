<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thám tử tin giả</title>
  <meta name="description" content="Game pixel về thẩm định ảnh AI giả quanh vụ lật tàu Vịnh Xanh 58. Tình huống, nhân vật là GIẢ LẬP.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="hide-sensitive">
  <a class="skip" href="#app">Bỏ qua tới nội dung</a>

  <header class="topbar">
    <div class="topbar-title">
      <span data-ui="gameTitle"></span>
      <span class="tag tag-sim" data-ui="simulated"></span>
    </div>
    <div class="topbar-room" id="topbar-room" aria-live="polite"></div>
    <div class="topbar-score" id="topbar-score"></div>
    <nav class="topbar-actions" aria-label="Công cụ">
      <button type="button" id="btn-map" class="btn-small" data-ui="topbar.map" hidden></button>
      <button type="button" id="btn-notebook" class="btn-small" data-ui="topbar.notebook"></button>
      <button type="button" id="btn-sources" class="btn-small" data-ui="topbar.sources"></button>
      <button type="button" id="btn-chatlog" class="btn-small" data-ui="topbar.chatLog"></button>
      <button type="button" id="btn-settings" class="btn-small" data-ui="topbar.settings"></button>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <p id="loading" class="loading" data-ui="loading">Đang tải hồ sơ…</p>

    <!-- S0: Trang chủ + cảnh báo -->
    <section id="screen-S0" class="screen" hidden>
      <div class="stage"><canvas class="scene" width="320" height="180" data-scene="S0"></canvas></div>
      <h1 class="case-title" id="s0-case-title"></h1>
      <div class="panel warning" role="note">
        <h2 data-ui="S0.warningTitle"></h2>
        <p data-ui="S0.warning"></p>
        <p class="muted" data-ui="S0.simulatedNote"></p>
      </div>
      <div class="actions">
        <button type="button" id="s0-start" class="btn-primary" data-ui="S0.start"></button>
        <button type="button" id="s0-continue" class="btn-primary" data-ui="S0.continue" hidden></button>
        <button type="button" id="s0-restart" class="btn" data-ui="S0.restart" hidden></button>
        <button type="button" id="s0-howto" class="btn" data-ui="S0.howTo"></button>
      </div>
    </section>

    <!-- S1: Nhận vụ án -->
    <section id="screen-S1" class="screen" hidden>
      <div class="stage"><canvas class="scene" width="320" height="180" data-scene="S1"></canvas></div>
      <h1 data-ui="S1.title"></h1>
      <form id="s1-name-form" class="panel">
        <label for="s1-name" data-ui="S1.nameLabel"></label>
        <input id="s1-name" name="heroName" maxlength="20" autocomplete="off">
        <p class="muted" data-ui="S1.nameHint"></p>
        <button type="submit" class="btn-primary" data-ui="S1.nameConfirm"></button>
      </form>
      <div id="s1-questions" class="panel" hidden>
        <h2 data-ui="S1.questionsTitle"></h2>
        <ol id="s1-question-list"></ol>
        <button type="button" id="s1-to-map" class="btn-primary" data-ui="S1.toMap"></button>
      </div>
    </section>

    <!-- S2: Bản đồ văn phòng -->
    <section id="screen-S2" class="screen" hidden>
      <div class="stage"><canvas class="scene" width="320" height="180" data-scene="S2"></canvas></div>
      <h1 data-ui="S2.title"></h1>
      <p data-ui="S2.intro"></p>
      <ul id="room-list" class="room-list"></ul>
    </section>

    <!-- S3-S8: Phòng điều tra (dựng từ quests.json) -->
    <section id="screen-room" class="screen" hidden>
      <div class="room-layout">
        <div class="room-materials">
          <button type="button" id="room-back" class="btn-small" data-ui="room.back"></button>
          <div class="stage"><canvas class="scene" width="320" height="180" id="room-canvas"></canvas></div>
          <h2 data-ui="room.materials"></h2>
          <div id="room-resources"></div>
        </div>
        <div class="room-investigation">
          <h1 id="room-title"></h1>
          <div id="room-quests"></div>
        </div>
      </div>
    </section>
  </main>

  <aside id="chat" class="chat" aria-label="Trò chuyện với NPC">
    <button type="button" id="chat-toggle" class="chat-toggle" aria-expanded="true" aria-controls="chat-body">
      <span data-ui="chat.title"></span>
    </button>
    <div id="chat-body" class="chat-body">
      <ol id="chat-messages" class="chat-messages" aria-live="polite"></ol>
      <div id="chat-choices" class="chat-choices"></div>
      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="chat-input" data-ui="chat.placeholder"></label>
        <input id="chat-input" autocomplete="off" maxlength="200">
        <button type="submit" class="btn-small" data-ui="chat.send"></button>
      </form>
    </div>
  </aside>

  <footer class="footer">
    <span class="tag tag-sim" data-ui="simulated"></span>
    <span data-ui="scoreDisclaimer"></span>
    <button type="button" id="footer-sources" class="btn-link" data-ui="topbar.sources"></button>
  </footer>

  <dialog id="modal" class="modal">
    <div class="modal-head">
      <h2 id="modal-title"></h2>
      <button type="button" id="modal-close" class="btn-small" data-ui="close"></button>
    </div>
    <div id="modal-body" class="modal-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
